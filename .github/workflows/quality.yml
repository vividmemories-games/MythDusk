name: Quality

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze

      - name: Validate documentation
        run: dart run tool/check_docs.dart

      - name: Validate game content
        run: dart run tool/validate_content.dart

      - name: Check bundled asset budget
        run: dart run tool/check_asset_budget.dart

      - name: Run tests
        run: flutter test
