name: mythdusk
description: "MythDusk — turn-based puzzle RPG. Match tiles for resources, spend AP on hero skills."
publish_to: 'none'
version: 0.1.4+10

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  shared_preferences: ^2.3.2
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  cloud_functions: ^5.4.0
  firebase_crashlytics: ^4.3.0
  firebase_analytics: ^11.4.0
  firebase_remote_config: ^5.4.0
  firebase_app_check: ^0.3.2
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon_1024.png
  adaptive_icon_background: "#0B1C24"
  adaptive_icon_foreground: assets/branding/app_icon_1024.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/levels/
    - assets/boards/
    - assets/heroes/
    - assets/enemies/
    - assets/images/tiles/
    - assets/images/skills/
    - assets/images/icons/
    - assets/images/ui/
    - assets/images/vfx/
    - assets/images/prep/
    - assets/images/backgrounds/
    - assets/images/backgrounds/battle/
    - assets/images/powerups/
    - assets/images/maps/
    - assets/enemies/bosses/
