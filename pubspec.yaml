name: mythdusk
description: "MythDusk — turn-based puzzle RPG. Match tiles for resources, spend AP on hero skills."
publish_to: 'none'
version: 0.1.1+6

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon_1024.png
  adaptive_icon_background: "#0B1C24"
  adaptive_icon_foreground: assets/branding/app_icon_1024.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/levels/
    - assets/boards/
    - assets/heroes/
    - assets/enemies/
    - assets/images/tiles/
    - assets/images/skills/
    - assets/images/icons/
    - assets/images/ui/
    - assets/images/vfx/
    - assets/images/prep/
    - assets/images/backgrounds/
    - assets/images/backgrounds/battle/
    - assets/images/powerups/
    - assets/images/maps/
    - assets/enemies/bosses/
